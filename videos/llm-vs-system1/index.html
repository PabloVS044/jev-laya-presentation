<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Manrope'; font-weight: 500; src: url('assets/fonts/manrope-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Manrope'; font-weight: 700; src: url('assets/fonts/manrope-latin-700-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Manrope'; font-weight: 800; src: url('assets/fonts/manrope-latin-800-normal.woff2') format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url('assets/fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2'); }
      :root {
        --bg: #f3f7fb; --ink: #0b1d30; --soft: #263a51; --muted: #4d6077;
        --blue: #0077c8; --deep: #005a97; --bright: #009ef7;
        --line: rgba(0, 90, 151, 0.18); --green: #157a46; --red: #b8322a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; font-family: 'Manrope', sans-serif; color: var(--ink); overflow: hidden; }
      #bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 60% 50% at 50% 55%, rgba(0, 158, 247, 0.08), transparent 70%),
          repeating-linear-gradient(0deg, rgba(0, 90, 151, 0.045) 0 1px, transparent 1px 64px),
          repeating-linear-gradient(90deg, rgba(0, 90, 151, 0.045) 0 1px, transparent 1px 64px),
          var(--bg);
      }
      .mono { font-family: 'JetBrains Mono', monospace; }
      #ask {
        position: absolute; left: 960px; top: 110px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 20px;
        padding: 22px 38px; border-radius: 999px; background: #fff; border: 2px solid var(--line);
        box-shadow: 0 20px 50px rgba(8, 40, 75, 0.12); font-size: 38px; font-weight: 700; white-space: nowrap;
      }
      #ask .q { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; font-weight: 800; }
      #ask small { font-family: 'JetBrains Mono', monospace; font-size: 22px; color: var(--muted); font-weight: 500; }

      .panel {
        position: absolute; top: 250px; width: 840px; height: 600px; border-radius: 34px;
        background: linear-gradient(160deg, #ffffff, #eef4fa); border: 1.5px solid var(--line);
        box-shadow: 0 30px 80px rgba(8, 40, 75, 0.12); padding: 44px 50px; overflow: hidden;
      }
      #left { left: 100px; }
      #right { left: 980px; }
      .ph { display: flex; align-items: center; justify-content: space-between; }
      .ph b { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; }
      .ph span { font-family: 'JetBrains Mono', monospace; font-size: 22px; padding: 8px 18px; border-radius: 999px; color: #fff; }
      #left .ph span { background: #5f7186; }
      #right .ph span { background: var(--blue); }
      .timer { margin-top: 26px; display: flex; align-items: baseline; gap: 16px; font-size: 26px; color: var(--muted); }
      .timer b { font-family: 'JetBrains Mono', monospace; font-size: 64px; font-weight: 500; color: var(--ink); }
      #right .timer b { color: var(--blue); }

      #stream {
        margin-top: 30px; height: 230px; padding: 28px 32px; border-radius: 22px;
        background: #0b1d30; color: #cfe3f5; font-family: 'JetBrains Mono', monospace; font-size: 34px; line-height: 1.5;
      }
      #stream i { font-style: normal; opacity: 0; }
      #stream .bad { border-radius: 6px; }
      #cursor { display: inline-block; width: 18px; height: 36px; background: var(--bright); vertical-align: middle; margin-left: 4px; }
      .verdict {
        position: absolute; left: 50px; bottom: 44px; display: flex; align-items: center; gap: 14px;
        padding: 16px 28px; border-radius: 999px; font-size: 30px; font-weight: 800; opacity: 0;
      }
      .verdict.bad { background: rgba(184, 50, 42, 0.1); color: var(--red); border: 2px solid var(--red); }
      .verdict.good { background: rgba(21, 122, 70, 0.1); color: var(--green); border: 2px solid var(--green); }

      .bars { margin-top: 34px; display: flex; flex-direction: column; gap: 22px; }
      .bar { display: grid; grid-template-columns: 230px 1fr 100px; align-items: center; gap: 20px; font-size: 32px; font-weight: 700; color: var(--soft); }
      .bar .track { height: 30px; border-radius: 15px; background: #e2ebf4; overflow: hidden; }
      .bar .fill { height: 100%; width: 0; border-radius: 15px; background: linear-gradient(90deg, var(--deep), var(--bright)); }
      .bar b { font-family: 'JetBrains Mono', monospace; font-weight: 500; text-align: right; }
      .bar.win { color: var(--ink); }

      #punch { position: absolute; left: 0; right: 0; top: 920px; text-align: center; font-size: 66px; font-weight: 800; letter-spacing: -0.03em; }
      #punch span { display: inline-block; opacity: 0; }
      #punch em { font-style: normal; background: linear-gradient(90deg, var(--deep), var(--bright)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1920" data-height="1080">
      <div id="bg"></div>
      <div id="ask"><span class="q">?</span>¿Qué tipo de documento es esta PO?<small>nueva · revisión · cancelación</small></div>

      <div id="left" class="panel">
        <div class="ph"><b>LLM generativo</b><span>escribe</span></div>
        <div class="timer"><b id="t-left">0.00 s</b>generando…</div>
        <div id="stream"><span id="chars"></span><span id="cursor"></span></div>
        <div id="v-bad" class="verdict bad">✕ "revisión parcial" no es una opción</div>
      </div>

      <div id="right" class="panel">
        <div class="ph"><b>Modelo de decisión</b><span>elige</span></div>
        <div class="timer"><b id="t-right">0.00 s</b>una pasada</div>
        <div class="bars">
          <div class="bar win"><span>PO nueva</span><div class="track"><div class="fill" data-w="91"></div></div><b>91%</b></div>
          <div class="bar"><span>Revisión</span><div class="track"><div class="fill" data-w="7"></div></div><b>7%</b></div>
          <div class="bar"><span>Cancelación</span><div class="track"><div class="fill" data-w="2"></div></div><b>2%</b></div>
        </div>
        <div id="v-good" class="verdict good">✓ Siempre una opción válida, con su %</div>
      </div>

      <div id="punch"><span>Uno</span> <span><em>escribe.</em></span> <span>El</span> <span>otro</span> <span><em>elige.</em></span></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Texto del LLM, carácter por carácter
      const text = '{"tipo": "revisión parcial", "confianza": "95%"}';
      const host = document.getElementById('chars');
      const badFrom = text.indexOf('revisión parcial');
      [...text].forEach((c, i) => {
        const el = document.createElement('i');
        el.textContent = c;
        if (i >= badFrom && i < badFrom + 'revisión parcial'.length) el.className = 'bad';
        host.appendChild(el);
      });

      tl.fromTo('#ask', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.1);
      tl.fromTo('.panel', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, stagger: 0.12, ease: 'power3.out' }, 0.5);

      // Cursor parpadeando
      tl.fromTo('#cursor', { opacity: 1 }, { opacity: 0, duration: 0.35, repeat: 15, yoyo: true, ease: 'steps(1)' }, 1.0);

      // LLM: escribe de 1.4 s a 6.4 s y su cronómetro llega a 1.84 s
      tl.to('#chars i', { opacity: 1, duration: 0.01, stagger: 5 / text.length }, 1.4);
      const tLeft = { v: 0 };
      tl.to(tLeft, { v: 1.84, duration: 5, ease: 'none', onUpdate: () => (document.getElementById('t-left').textContent = tLeft.v.toFixed(2) + ' s') }, 1.4);
      tl.to('#cursor', { opacity: 0, duration: 0.1 }, 6.5);
      tl.to('#chars .bad', { backgroundColor: 'rgba(184,50,42,0.55)', color: '#fff', duration: 0.3 }, 6.7);
      tl.fromTo('#v-bad', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2)' }, 6.9);

      // Modelo de decisión: 0.03 s y barras al instante
      const tRight = { v: 0 };
      tl.to(tRight, { v: 0.03, duration: 0.2, ease: 'none', onUpdate: () => (document.getElementById('t-right').textContent = tRight.v.toFixed(2) + ' s') }, 1.4);
      document.querySelectorAll('.fill').forEach((f, i) => {
        tl.to(f, { width: f.dataset.w + '%', duration: 0.6, ease: 'expo.out' }, 1.6 + i * 0.05);
      });
      tl.fromTo('#v-good', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2)' }, 2.4);

      // Remate
      tl.to('#left', { opacity: 0.55, duration: 0.6 }, 8.6);
      tl.to('#right', { boxShadow: '0 30px 90px rgba(0,119,200,0.35)', borderColor: '#0077c8', duration: 0.6 }, 8.6);
      tl.to('#punch span', { opacity: 1, duration: 0.5, stagger: 0.14, ease: 'power3.out' }, 8.8);

      tl.to({}, { duration: 0.1 }, 12.9);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
